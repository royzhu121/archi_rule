<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>消防审图系统 · FireCheck Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════
   CSS 变量 & 重置
══════════════════════════════════════════════ */
:root {
  --bg-primary:    #EAF2FB;
  --bg-secondary:  #DCEAFF;
  --bg-card:       rgba(255, 255, 255, 0.9);
  --bg-input:      rgba(0, 88, 163, 0.08);
  --bg-input-hover:rgba(0, 88, 163, 0.14);

  --border:        rgba(0, 88, 163, 0.2);
  --border-active: rgba(0, 88, 163, 0.55);

  --cyan:    #0058A3;
  --cyan-dim: rgba(0, 88, 163, 0.12);
  --purple:  #0A6ECF;
  --purple-dim: rgba(10, 110, 207, 0.12);

  --green:   #10B981;
  --green-dim: rgba(16,185,129,0.12);
  --amber:   #F59E0B;
  --amber-dim: rgba(245,158,11,0.12);
  --red:     #EF4444;
  --red-dim: rgba(239,68,68,0.12);

  --text-primary:   #0D2C4F;
  --text-secondary: #214E7A;
  --text-muted:     #4D6D8E;

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;

  --shadow-glow-cyan: 0 0 20px rgba(0, 88, 163, 0.22);
  --shadow-glow-purple: 0 0 20px rgba(10, 110, 207, 0.2);
  --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Inter', sans-serif;
  background: radial-gradient(circle at top right, #F2F7FF 0%, var(--bg-primary) 48%, #D7E8FA 100%);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
}

/* 全局背景网格 */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background-image:
    linear-gradient(rgba(122,147,169,0.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(122,147,169,0.08) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}

/* ══════════════════════════════════════════════
   顶部 Header
══════════════════════════════════════════════ */
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(234,242,251,0.92);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
  height: 64px;
  display: flex; align-items: center; justify-content: space-between;
}
.logo {
  display: flex; align-items: center; gap: 12px;
}
.logo-icon {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--cyan), var(--purple));
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.logo-text {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 18px; font-weight: 700;
  background: linear-gradient(135deg, var(--cyan), var(--purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.logo-sub {
  font-size: 11px; color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.1em;
}
.header-right {
  display: flex; align-items: center; gap: 16px;
}
.header-action-btn {
  padding: 7px 11px;
  border-radius: 10px;
  border: 1px solid rgba(0,88,163,0.22);
  background: rgba(255,255,255,0.48);
  color: var(--text-primary);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
}
.header-action-btn:hover {
  background: rgba(255,255,255,0.78);
  border-color: rgba(0,88,163,0.35);
}
.badge-building {
  font-size: 11px; color: var(--text-primary);
  background: var(--cyan-dim);
  border: 1px solid rgba(122,147,169,0.3);
  border-radius: 20px;
  padding: 4px 12px;
  font-family: 'JetBrains Mono', monospace;
}
.status-dot {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--text-secondary);
  --dot-color: var(--text-secondary);
}
.status-dot::before {
  content: '';
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--dot-color);
  box-shadow: 0 0 8px var(--dot-color);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ══════════════════════════════════════════════
   主布局
══════════════════════════════════════════════ */
.app-layout {
  position: relative; z-index: 1;
  display: grid;
  grid-template-columns: 420px 1fr;
  gap: 0;
  min-height: calc(100vh - 64px);
}

/* ══════════════════════════════════════════════
   左侧 - 输入面板
══════════════════════════════════════════════ */
.input-panel {
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 24px 24px 24px;
  display: flex; flex-direction: column; gap: 16px;
  position: sticky; top: 64px; height: calc(100vh - 64px);
}
.input-panel::-webkit-scrollbar { width: 4px; }
.input-panel::-webkit-scrollbar-track { background: transparent; }
.input-panel::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.1);
  border-radius: 4px;
}

/* 分区标题 */
.section-header {
  display: flex; align-items: center; gap: 10px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
  cursor: default;
  user-select: none;
}
.section-number {
  width: 22px; height: 22px;
  border-radius: 6px;
  background: linear-gradient(135deg, var(--cyan), var(--purple));
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
  flex-shrink: 0;
}
.section-title {
  font-size: 13px; font-weight: 600; color: var(--text-primary);
  letter-spacing: 0.02em;
  flex: 1;
}
.section-chevron {
  color: var(--text-muted); font-size: 12px;
  transition: transform var(--transition);
}
.section-card.collapsed .section-chevron { transform: rotate(-90deg); }
.section-body { display: flex; flex-direction: column; gap: 10px; }
.section-card.collapsed .section-body { display: none; }

/* 卡片 */
.section-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px;
  backdrop-filter: blur(8px);
  transition: border-color var(--transition);
}
.section-card:hover { border-color: rgba(255,255,255,0.12); }

/* 表单元素 */
.form-row {
  display: flex; flex-direction: column; gap: 6px;
}
.form-row.row-2 {
  flex-direction: row; gap: 10px;
}
.form-row.row-2 > * { flex: 1; }
label {
  font-size: 11px; font-weight: 500;
  color: var(--text-secondary); letter-spacing: 0.05em;
  text-transform: uppercase;
}
input[type="text"], input[type="number"], select {
  width: 100%;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  padding: 9px 12px;
  outline: none;
  transition: all var(--transition);
  appearance: none;
}
input:focus, select:focus {
  border-color: var(--border-active);
  background: var(--bg-input-hover);
  box-shadow: var(--shadow-glow-cyan);
}
input:hover, select:hover {
  background: var(--bg-input-hover);
}
select option { background: #F1F7FF; color: var(--text-primary); }

/* 自定义 select 箭头 */
.select-wrapper {
  position: relative;
}
.select-wrapper select { padding-right: 32px; }
.select-wrapper::after {
  content: '▾';
  position: absolute; right: 10px; top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted); font-size: 12px;
  pointer-events: none;
}

/* 影响项复选框 */
.impact-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.check-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--transition);
  user-select: none;
}
.check-item:hover {
  background: var(--bg-input-hover);
  border-color: rgba(255,255,255,0.12);
}
.check-item.active {
  background: rgba(122,147,169,0.16);
  border-color: rgba(122,147,169,0.42);
}
.check-item.danger.active {
  background: rgba(239,68,68,0.06);
  border-color: rgba(239,68,68,0.3);
}
.check-item input[type="checkbox"] { display: none; }
.check-box {
  width: 16px; height: 16px; flex-shrink: 0;
  border: 1.5px solid var(--border);
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
  font-size: 10px;
}
.check-item.active .check-box {
  background: var(--cyan);
  border-color: var(--cyan);
  color: #000;
}
.check-item.danger.active .check-box {
  background: var(--red);
  border-color: var(--red);
  color: #fff;
}
.check-label {
  font-size: 12px; color: var(--text-secondary);
  line-height: 1.3;
}
.check-item.active .check-label { color: var(--text-primary); }

/* 危险安全阀开关 */
.toggle-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 10px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--transition);
}
.toggle-row:hover { background: var(--bg-input-hover); }
.toggle-row.danger.active {
  background: rgba(239,68,68,0.08);
  border-color: rgba(239,68,68,0.4);
}
.toggle-label { font-size: 12px; color: var(--text-secondary); }
.toggle-switch {
  width: 32px; height: 18px;
  background: var(--text-muted);
  border-radius: 9px;
  position: relative;
  transition: background var(--transition);
}
.toggle-switch::after {
  content: '';
  position: absolute; top: 2px; left: 2px;
  width: 14px; height: 14px;
  background: #fff; border-radius: 50%;
  transition: transform var(--transition);
}
.toggle-row.active .toggle-switch { background: var(--cyan); }
.toggle-row.danger.active .toggle-switch { background: var(--red); }
.toggle-row.active .toggle-switch::after { transform: translateX(14px); }

/* 提交按钮 */
.submit-btn {
  width: 100%; padding: 13px;
  background: linear-gradient(135deg, var(--cyan), var(--purple));
  border: none; border-radius: var(--radius-md);
  color: #F6FAFD; font-family: 'Space Grotesk', sans-serif;
  font-size: 14px; font-weight: 700;
  cursor: pointer; letter-spacing: 0.05em;
  transition: all var(--transition);
  position: static;
  margin-top: 8px;
  flex-shrink: 0;
  z-index: 3;
  overflow: hidden;
}
.submit-btn::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
  opacity: 0; transition: opacity var(--transition);
}
.submit-btn:hover::before { opacity: 1; }
.submit-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(122,147,169,0.35); }
.submit-btn:active { transform: translateY(0); }
.submit-btn:disabled {
  opacity: 0.5; cursor: not-allowed;
  background: var(--text-muted);
  transform: none; box-shadow: none;
}
.submit-btn.loading::after {
  content: '';
  position: absolute; top: 50%; left: 50%;
  width: 18px; height: 18px;
  margin: -9px 0 0 -9px;
  border: 2px solid rgba(255,255,255,0.35);
  border-top-color: #F6FAFD;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

.secondary-btn {
  width: 100%;
  padding: 11px 12px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-active);
  background: rgba(0, 88, 163, 0.08);
  color: var(--text-primary);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
}

.secondary-btn:hover {
  background: rgba(0, 88, 163, 0.15);
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ══════════════════════════════════════════════
   右侧 - 结果面板
══════════════════════════════════════════════ */
.results-panel {
  padding: 24px 28px;
  overflow-y: auto;
}

/* 空状态 */
.empty-state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; height: 100%;
  min-height: 500px;
  gap: 20px; opacity: 0.6;
}
.empty-icon {
  font-size: 64px;
  animation: float 3s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
.empty-text {
  font-size: 16px; color: var(--text-secondary);
  font-family: 'Space Grotesk', sans-serif;
}
.empty-sub {
  font-size: 13px; color: var(--text-muted);
  text-align: center; max-width: 320px; line-height: 1.6;
}

/* 结果区 */
.results-content { display: flex; flex-direction: column; gap: 16px; }

/* 总结论 Banner */
.verdict-banner {
  border-radius: var(--radius-lg);
  padding: 20px 24px;
  border: 1px solid;
  animation: slideIn 0.4s cubic-bezier(0.4,0,0.2,1);
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(-12px); }
  to { opacity: 1; transform: translateY(0); }
}
.verdict-banner.manual {
  background: rgba(239,68,68,0.08);
  border-color: rgba(239,68,68,0.3);
}
.verdict-banner.violation {
  background: rgba(245,158,11,0.08);
  border-color: rgba(245,158,11,0.3);
}
.verdict-banner.pass {
  background: rgba(16,185,129,0.08);
  border-color: rgba(16,185,129,0.3);
}
.verdict-header {
  display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
}
.verdict-icon { font-size: 24px; }
.verdict-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 16px; font-weight: 700;
}
.verdict-banner.manual .verdict-title { color: var(--red); }
.verdict-banner.violation .verdict-title { color: var(--amber); }
.verdict-banner.pass .verdict-title { color: var(--green); }
.verdict-body { font-size: 13px; color: var(--text-secondary); line-height: 1.7; }
.manual-reasons { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.manual-reason-item {
  font-size: 12px; color: var(--red);
  background: rgba(239,68,68,0.08);
  border: 1px solid rgba(239,68,68,0.2);
  border-radius: 6px; padding: 6px 10px;
}

/* 高亮汇总 */
.highlights-section {
  background: var(--bg-card);
  border: 1px solid rgba(245,158,11,0.25);
  border-radius: var(--radius-md);
  padding: 16px 20px;
  animation: slideIn 0.45s cubic-bezier(0.4,0,0.2,1);
}
.highlights-title {
  font-size: 12px; font-weight: 600;
  color: var(--amber); letter-spacing: 0.08em;
  text-transform: uppercase; margin-bottom: 10px;
  display: flex; align-items: center; gap: 6px;
}
.highlight-list { display: flex; flex-direction: column; gap: 6px; }
.highlight-item {
  font-size: 12px; line-height: 1.5;
  padding: 7px 10px;
  border-radius: 6px;
}
.highlight-item.critical {
  background: rgba(239,68,68,0.08); color: #FCA5A5;
  border-left: 2px solid var(--red);
}
.highlight-item.warning {
  background: rgba(245,158,11,0.08); color: #FCD34D;
  border-left: 2px solid var(--amber);
}

/* 专业模块卡片 */
.modules-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.module-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  overflow: hidden;
  backdrop-filter: blur(8px);
  transition: all var(--transition);
  animation: slideIn 0.5s cubic-bezier(0.4,0,0.2,1);
}
.module-card:hover {
  border-color: rgba(255,255,255,0.15);
  transform: none;
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}
.module-card.status-violation {
  border-color: rgba(239,68,68,0.3);
  box-shadow: 0 0 16px rgba(239,68,68,0.08);
}
.module-card.status-warning {
  border-color: rgba(245,158,11,0.25);
}
.module-card.status-pass {
  border-color: rgba(16,185,129,0.2);
}

.module-header {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px;
  cursor: default;
  border-bottom: 1px solid transparent;
  transition: all var(--transition);
}
.module-card.expanded .module-header {
  border-bottom-color: var(--border);
  background: rgba(255,255,255,0.02);
}
.module-status-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.status-violation .module-status-dot { background: var(--red); box-shadow: 0 0 6px var(--red); }
.status-warning .module-status-dot { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
.status-pass .module-status-dot { background: var(--green); box-shadow: 0 0 6px var(--green); }

.module-name {
  font-size: 12px; font-weight: 600; flex: 1;
  color: var(--text-primary); letter-spacing: 0.02em;
}
.module-badge {
  font-size: 10px; padding: 2px 8px;
  border-radius: 10px; font-weight: 600;
  font-family: 'JetBrains Mono', monospace;
}
.status-violation .module-badge { background: var(--red-dim); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }
.status-warning .module-badge { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(245,158,11,0.3); }
.status-pass .module-badge { background: var(--green-dim); color: var(--green); border: 1px solid rgba(16,185,129,0.3); }

.module-chevron { color: var(--text-muted); font-size: 11px; transition: transform var(--transition); }
.module-card.expanded .module-chevron { transform: rotate(180deg); }

.module-summary {
  padding: 10px 16px;
  font-size: 11px; color: var(--cyan);
  font-family: 'JetBrains Mono', monospace;
  line-height: 1.5;
  border-bottom: 1px solid var(--border);
  background: var(--cyan-dim);
}

.module-body {
  padding: 14px 16px;
  display: none; flex-direction: column; gap: 10px;
}
.module-card.expanded .module-body { display: flex; }

.detail-line {
  font-size: 12px; color: var(--text-secondary); line-height: 1.7;
  white-space: pre-wrap;
}
.detail-line.calc {
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  color: var(--cyan); background: var(--cyan-dim);
  padding: 8px 10px; border-radius: 6px;
}

.impact-section { margin-top: 4px; }
.impact-title {
  font-size: 10px; font-weight: 600; color: var(--amber);
  letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px;
}
.impact-item {
  font-size: 11px; padding: 6px 8px; border-radius: 6px;
  margin-bottom: 4px; line-height: 1.5;
}
.impact-item.critical { background: rgba(239,68,68,0.08); color: #FCA5A5; border-left: 2px solid var(--red); }
.impact-item.warning { background: rgba(245,158,11,0.08); color: #FCD34D; border-left: 2px solid var(--amber); }
.impact-item.info { background: rgba(122,147,169,0.16); color: var(--text-secondary); border-left: 2px solid rgba(122,147,169,0.4); }

.suggestion-section { margin-top: 4px; }
.suggestion-title {
  font-size: 10px; font-weight: 600; color: var(--purple);
  letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px;
}
.suggestion-item {
  font-size: 11px; color: #C4B5FD;
  background: var(--purple-dim);
  border: 1px solid rgba(168,85,247,0.15);
  border-radius: 6px; padding: 6px 8px; margin-bottom: 4px; line-height: 1.5;
}

.refs-section { margin-top: 4px; }
.refs-title {
  font-size: 10px; font-weight: 600; color: var(--text-muted);
  letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px;
}
.ref-item {
  font-size: 11px; color: var(--text-muted);
  border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 8px; margin-bottom: 4px; line-height: 1.5;
  cursor: pointer; transition: all var(--transition);
}
.ref-item:hover {
  background: rgba(255,255,255,0.03);
  color: var(--text-secondary);
  border-color: rgba(255,255,255,0.12);
}
.ref-item .ref-id { color: var(--cyan); font-family: 'JetBrains Mono', monospace; font-weight: 600; }

/* AI综合意见 */
.llm-section {
  background: var(--bg-card);
  border: 1px solid rgba(168,85,247,0.25);
  border-radius: var(--radius-md);
  padding: 20px;
  animation: slideIn 0.6s cubic-bezier(0.4,0,0.2,1);
  position: relative; overflow: hidden;
}
.llm-section::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--purple), var(--cyan));
}
.llm-header {
  display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
}
.llm-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.mini-btn {
  padding: 7px 11px;
  border-radius: 10px;
  border: 1px solid rgba(168,85,247,0.28);
  background: rgba(168,85,247,0.08);
  color: var(--text-primary);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
}
.mini-btn:hover {
  background: rgba(168,85,247,0.14);
}
.mini-btn.primary {
  background: linear-gradient(135deg, var(--cyan), var(--purple));
  color: #fff;
  border-color: transparent;
}
.mini-btn.primary:hover {
  filter: brightness(1.05);
}
.mini-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}
.self-check-result {
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 10px;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid rgba(122,147,169,0.18);
  background: rgba(255,255,255,0.5);
  display: none;
}
.self-check-result.ok {
  border-color: rgba(16,185,129,0.25);
  background: rgba(16,185,129,0.06);
  color: var(--green);
}
.self-check-result.fail {
  border-color: rgba(239,68,68,0.28);
  background: rgba(239,68,68,0.06);
  color: var(--red);
}

.qwen-modal {
  position: fixed;
  inset: 0;
  z-index: 300;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(13,44,79,0.28);
  backdrop-filter: blur(8px);
  padding: 24px;
}
.qwen-modal-card {
  width: min(560px, 100%);
  border-radius: 18px;
  border: 1px solid rgba(0,88,163,0.18);
  background: rgba(255,255,255,0.96);
  box-shadow: 0 28px 60px rgba(13,44,79,0.22);
  padding: 20px;
}
.qwen-modal-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 8px;
}
.qwen-modal-sub {
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 14px;
  line-height: 1.6;
}
.qwen-modal-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 8px;
}
.qwen-key-input {
  width: 100%;
  border: 1px solid rgba(0,88,163,0.22);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 13px;
  background: rgba(234,242,251,0.55);
  color: var(--text-primary);
  outline: none;
}
.qwen-key-input:focus {
  border-color: rgba(0,88,163,0.6);
  box-shadow: var(--shadow-glow-cyan);
}
.qwen-modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 16px;
}
.qwen-modal-note {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 10px;
}
.llm-badge {
  font-size: 10px; padding: 3px 8px;
  background: var(--purple-dim); color: var(--purple);
  border: 1px solid rgba(168,85,247,0.3);
  border-radius: 10px; font-family: 'JetBrains Mono', monospace; font-weight: 600;
}
.llm-title {
  font-size: 13px; font-weight: 600; color: var(--text-primary);
}
.llm-body {
  font-size: 13px; color: var(--text-secondary);
  line-height: 1.8; white-space: pre-wrap;
}
.llm-loading {
  display: flex; align-items: center; gap: 10px;
  color: var(--text-muted); font-size: 13px;
}
.llm-loading::before {
  content: '';
  width: 16px; height: 16px;
  border: 2px solid rgba(168,85,247,0.2);
  border-top-color: var(--purple);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  flex-shrink: 0;
}

/* 计算结果展示 */
.calc-block {
  background: rgba(0,0,0,0.2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--cyan);
  line-height: 1.7;
}

/* 加载骨架 */
.skeleton {
  background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: 6px;
}
@keyframes shimmer { to { background-position: -200% 0; } }

/* 响应式 */
@media (max-width: 1200px) {
  .modules-grid { grid-template-columns: 1fr; }
}
@media (max-width: 900px) {
  .app-layout { grid-template-columns: 1fr; }
  .input-panel { position: static; height: auto; }
}
</style>
</head>
<body>

<!-- ══ Header ══ -->
<header class="header">
  <div class="logo">
    <div class="logo-icon">🔥</div>
    <div>
      <div class="logo-text">FireCheck Pro</div>
      <div class="logo-sub">租户二次消防审图系统 v1.0</div>
    </div>

  <div class="header-right">

<!-- ══ 主布局 ══ -->

  <!-- ══ 左侧：输入面板 ══ -->

    <!-- § 1 项目基本信息 -->
    <div class="section-card" id="sec1">
      <div class="section-header" onclick="toggleSection('sec1')">

        <div class="form-row row-2">

              <option value="通透吊顶，通透率≤70%">通透吊顶，通透率≤70%</option>

    <!-- § 3 影响项/改造项 -->
    <div class="section-card" id="sec4">
      <div class="section-header" onclick="toggleSection('sec4')">

        <div class="section-title">影响项 / 改造项</div>

      <div class="section-body">
        <div class="impact-grid">
          <div class="check-item" onclick="toggleCheck(this, 'newWall')">

          </div>

      开始审图

  </aside>

  <!-- ══ 右侧：结果面板 ══ -->
  <main class="results-panel" id="resultsPanel">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🏗️</div>
      <div class="empty-text">填写左侧参数，点击「开始审图」</div>
      <div class="empty-sub">系统将基于规范条文进行六大专业模块审查，并由 AI 生成综合意见</div>
    </div>
    <div class="results-content" id="resultsContent" style="display:none;"></div>
  </main>

</div>

<!-- ══ 千问配置弹窗 ══ -->
<div class="qwen-modal" id="qwenModal" onclick="closeQwenModal(event)">
  <div class="qwen-modal-card" onclick="event.stopPropagation()">
    <div class="qwen-modal-title">配置千问 API Key</div>
    <div class="qwen-modal-sub">
      只保存在本机浏览器，不会发送到聊天里。保存后，自检按钮和审图请求会自动带上这个 Key。
    </div>
    <label class="qwen-modal-label" for="qwenApiKeyInput">API Key</label>
    <input id="qwenApiKeyInput" class="qwen-key-input" type="password" placeholder="请输入千问 API Key">
    <div class="qwen-modal-actions">
      <button class="mini-btn" onclick="clearQwenKey()">清除</button>
      <button class="mini-btn" onclick="closeQwenModal()">取消</button>
      <button class="mini-btn primary" onclick="saveQwenKey()">保存并关闭</button>
    </div>
    <div class="qwen-modal-note" id="qwenModalNote">当前状态：未配置</div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════
   全局状态
══════════════════════════════════════════════ */
let profilesData = null;
let lastReviewRequest = null;
let lastReviewResult = null;
let backendOnline = false;
let healthTimer = null;
const QWEN_KEY_STORAGE = 'firecheck_qwen_api_key';
const API = (() => {
  const isHttp = window.location.protocol === 'http:' || window.location.protocol === 'https:';
  if (isHttp) {
    // Prefer same-origin API when frontend is served by FastAPI.
    return window.location.origin;
  }
  // Fallback for local file preview.
  return 'http://127.0.0.1:8000';
})();

const MODULE_CONFIG = {
  occupancy_floor: { icon: '🏢', label: '业态与楼层符合性' },
  decoration:    { icon: '🎨', label: '内装修防火' },
  sprinkler:     { icon: '💧', label: '自动喷水灭火' },
  smoke_exhaust: { icon: '💨', label: '防烟排烟' },
  alarm:         { icon: '🔔', label: '火灾自动报警' },
  evacuation:    { icon: '🚪', label: '应急照明疏散指示' },
  hydrant:       { icon: '🧯', label: '消火栓及灭火器' },
};

const STATUS_LABELS = {
  pass: '合规',
  warning: '注意',
  violation: '违规',
};

/* ══════════════════════════════════════════════
   初始化
══════════════════════════════════════════════ */
async function init() {
  setStatus('连接后端中…', 'amber');
  syncQwenModalNote();
  try {
    profilesData = await fetchJSONWithRetry(`${API}/api/tenant-profiles`, {
      retries: 5,
      retryDelay: 800,
      timeout: 4000,
    });
    populateTenant1();
    setBackendConnectivity(true);
  } catch(e) {
    setBackendConnectivity(false);
    console.warn('无法连接后端，请先运行 run.py', e);
    // 使用本地数据兜底
    profilesData = getLocalProfiles();
    populateTenant1();
  }

  // 每 10 秒自动健康检查，支持离线后自动恢复在线。
  startHealthMonitor();
}

function getStoredQwenKey() {
  try {
    return localStorage.getItem(QWEN_KEY_STORAGE) || '';
  } catch (_) {
    return '';
  }
}

function hasLocalQwenKey() {
  return !!getStoredQwenKey().trim();
}

function getRequestHeaders(includeJson = true) {
  const headers = {};
  const key = getStoredQwenKey().trim();
  if (key) {
    headers['X-QWEN-API-KEY'] = key;
  }
  if (includeJson) {
    headers['Content-Type'] = 'application/json';
  }
  return headers;
}

function syncQwenModalNote() {
  const note = document.getElementById('qwenModalNote');
  if (!note) return;
  note.textContent = hasLocalQwenKey() ? '当前状态：已保存到本机浏览器' : '当前状态：未配置';
}

function openQwenModal() {
  const modal = document.getElementById('qwenModal');
  const input = document.getElementById('qwenApiKeyInput');
  if (!modal || !input) return;
  input.value = getStoredQwenKey();
  modal.style.display = 'flex';
  syncQwenModalNote();
  setTimeout(() => input.focus(), 0);
}

function closeQwenModal(evt) {
  if (evt && evt.target !== evt.currentTarget) return;
  const modal = document.getElementById('qwenModal');
  if (modal) modal.style.display = 'none';
}

function saveQwenKey() {
  const input = document.getElementById('qwenApiKeyInput');
  const value = (input?.value || '').trim();
  if (!value) {
    alert('请输入 API Key');
    return;
  }
  localStorage.setItem(QWEN_KEY_STORAGE, value);
  syncQwenModalNote();
  closeQwenModal();
  setStatus('千问 Key 已保存', 'green');
}

function clearQwenKey() {
  localStorage.removeItem(QWEN_KEY_STORAGE);
  const input = document.getElementById('qwenApiKeyInput');
  if (input) input.value = '';
  syncQwenModalNote();
  setStatus('千问 Key 已清除', 'amber');
}

async function fetchJSONWithRetry(url, { retries = 3, retryDelay = 600, timeout = 3000 } = {}) {
  let lastError = null;
  for (let i = 0; i < retries; i++) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeout);
    try {
      const res = await fetch(url, { signal: controller.signal, cache: 'no-store' });
      clearTimeout(timer);
      if (!res.ok) {
        throw new Error(`HTTP ${res.status}`);
      }
      return await res.json();
    } catch (err) {
      clearTimeout(timer);
      lastError = err;
      if (i < retries - 1) {
        await new Promise(r => setTimeout(r, retryDelay));
      }
    }
  }
  throw lastError || new Error('backend_unreachable');
}

function getLocalProfiles() {
  return {
    level1_options: ['普通商业零售类','餐饮（不使用明火）','餐饮（使用明火）','娱乐体验类','儿童及教培类','运动休闲类','生活服务及配套'],
    level1_to_level2: {
      '普通商业零售类': ['服装/鞋履/箱包/化妆品/珠宝/钟表','便利店/超市（无明火）'],
      '餐饮（不使用明火）': ['中餐（无明火）','西餐（无明火）','中央厨房复热餐厅'],
      '餐饮（使用明火）': ['中餐/西餐（明火）','火锅/烧烤'],
      '娱乐体验类': ['电影院','KTV/电竞馆/密室逃脱/剧本杀'],
      '儿童及教培类': ['儿童乐园','儿童培训/亲子'],
      '运动休闲类': ['健身房/瑜伽/攀岩'],
      '生活服务及配套': ['银行/美容美发/后勤/仓储/设备'],
    },
    profiles: {}
  };
}

function setStatus(text, color) {
  const dot = document.getElementById('statusDot');
  dot.textContent = text;
  const colorMap = {
    green: 'var(--green)',
    red: 'var(--red)',
    amber: 'var(--amber)',
    default: 'var(--text-secondary)',
  };
  const resolved = colorMap[color] || colorMap.default;
  dot.style.color = resolved;
  dot.style.setProperty('--dot-color', resolved);
}

function setBackendConnectivity(isOnline) {
  backendOnline = isOnline;
  const dot = document.getElementById('statusDot');
  const currentText = dot ? (dot.textContent || '') : '';
  const isBackendText = currentText.startsWith('后端') || currentText.startsWith('连接后端');

  if (!isOnline) {
    setStatus('后端离线', 'red');
    return;
  }

  // 只在状态栏当前用于表示后端连接时更新为在线，避免覆盖“审查中”等业务状态提示。
  if (isBackendText) {
    setStatus('后端在线', 'green');
  }
}

async function checkBackendHealth() {
  try {
    await fetchJSONWithRetry(`${API}/api/health`, {
      retries: 2,
      retryDelay: 500,
      timeout: 2500,
    });
    setBackendConnectivity(true);
  } catch (_) {
    setBackendConnectivity(false);
  }
}

function startHealthMonitor() {
  if (healthTimer) {
    clearInterval(healthTimer);
  }
  healthTimer = setInterval(checkBackendHealth, 10000);
}

/* ══════════════════════════════════════════════
   业态下拉菜单
══════════════════════════════════════════════ */
function populateTenant1() {
  const sel = document.getElementById('tenant1');
  sel.innerHTML = '<option value="">── 请选择 ──</option>';
  profilesData.level1_options.forEach(opt => {
    const o = document.createElement('option');
    o.value = opt; o.textContent = opt;
    sel.appendChild(o);
  });
}

function updateTenant2() {
  const l1 = document.getElementById('tenant1').value;
  const sel = document.getElementById('tenant2');
  sel.innerHTML = '';
  if (!l1 || !profilesData.level1_to_level2[l1]) {
    sel.innerHTML = '<option value="">── 请先选择一级业态 ──</option>';
    return;
  }
  profilesData.level1_to_level2[l1].forEach(opt => {
    const o = document.createElement('option');
    o.value = opt; o.textContent = opt;
    sel.appendChild(o);
  });
  onTenant2Change();
}

async function onTenant2Change() {
  const t2 = document.getElementById('tenant2').value;
  const t1 = document.getElementById('tenant1').value;
  const floor = document.getElementById('floor').value;
  const badge = document.getElementById('riskBadge');
  if (!t2 || !profilesData.profiles[t2]) { badge.style.display = 'none'; return; }
  const p = profilesData.profiles[t2];
  const isAuto = p.auto_review;
  let hazardText = p.sprinkler_hazard || '中危险级I';

  if (backendOnline) {
    try {
      const q = `tenant_type_1=${encodeURIComponent(t1)}&tenant_type_2=${encodeURIComponent(t2)}&floor=${encodeURIComponent(floor)}`;
      const hazardResp = await fetchJSONWithRetry(`${API}/api/sprinkler-hazard?${q}`, {
        retries: 2,
        retryDelay: 300,
        timeout: 2000,
      });
      if (hazardResp && hazardResp.sprinkler_hazard) {
        hazardText = hazardResp.sprinkler_hazard;
      }
    } catch (_) {
      // 后端临时抖动时，回退到画像库默认值。
    }
  }

  badge.style.display = 'block';
  if (!isAuto) {
    badge.style.background = 'rgba(245,158,11,0.08)';
    badge.style.border = '1px solid rgba(245,158,11,0.3)';
    badge.style.color = 'var(--amber)';
    badge.textContent = '⚠ 高风险业态：系统会出具报告，并提示工程师重点复核';
  } else {
    badge.style.background = 'rgba(16,185,129,0.06)';
    badge.style.border = '1px solid rgba(16,185,129,0.2)';
    badge.style.color = 'var(--green)';
    badge.textContent = `✓ 可自动审查 · 喷淋危险等级：${hazardText}`;
  }
}

/* ══════════════════════════════════════════════
   UI 交互
══════════════════════════════════════════════ */
function toggleSection(id) {
  const card = document.getElementById(id);
  card.classList.toggle('collapsed');
}

function toggleCheck(el, id) {
  const cb = document.getElementById(id);
  cb.checked = !cb.checked;
  el.classList.toggle('active', cb.checked);
}

function toggleDanger(id, el) {
  const cb = document.getElementById(id);
  cb.checked = !cb.checked;
  el.classList.toggle('active', cb.checked);
}

/* ══════════════════════════════════════════════
   提交审图
══════════════════════════════════════════════ */
async function submitReview() {
  const btn = document.getElementById('submitBtn');
  const area = parseFloat(document.getElementById('area').value);
  const t1 = document.getElementById('tenant1').value;
  const t2 = document.getElementById('tenant2').value;

  if (!t1 || !t2) { alert('请选择业态类型'); return; }
  if (!area || area <= 0) { alert('请输入有效的房间面积'); return; }

  btn.disabled = true;
  btn.classList.add('loading');
  btn.textContent = '';
  setStatus('审查中…', 'amber');

  const payload = {
    site: document.getElementById('site').value || '南宁宜家',
    tenant_name: document.getElementById('tenantName').value || '',
    floor: document.getElementById('floor').value,
    tenant_type_1: t1,
    tenant_type_2: t2,
    area: area,
    ceiling_type: document.getElementById('ceilingType').value,
    ceiling_height: parseFloat(document.getElementById('ceilingHeight').value) || 3.5,
    room_max_length: parseFloat(document.getElementById('roomLength').value) || 0,
    change_fire_zone: false,
    change_smoke_zone: false,
    complex_space: false,
    new_wall: document.getElementById('newWall').checked,
    wall_to_ceiling: document.getElementById('wallToCeiling').checked,
    new_enclosed_room: document.getElementById('newEnclosedRoom').checked,
    high_shelves: document.getElementById('highShelves').checked,
    block_sprinkler: false,
    block_detector: false,
    block_smoke_vent: false,
    block_hydrant: false,
    block_evacuation_sign: false,
  };

  try {
    const res = await fetch(`${API}/api/review`, {
      method: 'POST',
      headers: getRequestHeaders(),
      body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    lastReviewRequest = payload;
    lastReviewResult = data;
    renderResults(data);
    setStatus('审查完成', 'green');
    if (backendOnline) {
      setTimeout(() => setStatus('后端在线', 'green'), 1200);
    }
  } catch (e) {
    setStatus('请求失败', 'red');
    renderError(e.message);
  } finally {
    btn.disabled = false;
    btn.classList.remove('loading');
    btn.textContent = '重新审图';
  }
}

/* ══════════════════════════════════════════════
   渲染结果
══════════════════════════════════════════════ */
function renderResults(data) {
  document.getElementById('emptyState').style.display = 'none';
  const content = document.getElementById('resultsContent');
  content.style.display = 'flex';
  content.innerHTML = '';

  // 1. 总结论 Banner
  content.appendChild(buildVerdictBanner(data));

  // 2. 高亮汇总（如有影响项）
  if (data.highlights && data.highlights.length > 0) {
    content.appendChild(buildHighlights(data.highlights));
  }

  // 3. 专业模块
  if (data.modules) {
    const grid = document.createElement('div');
    grid.className = 'modules-grid';
    Object.entries(data.modules).forEach(([key, mod]) => {
      grid.appendChild(buildModuleCard(key, mod));
    });
    content.appendChild(grid);
  }

  // 4. AI综合意见
  if (data.llm_opinion) {
    content.appendChild(buildLLMSection(data.llm_opinion));
  }

  // 5. 报告下载
  content.appendChild(buildReportActionBar());

  // 滚动到顶
  document.getElementById('resultsPanel').scrollTo({ top: 0, behavior: 'smooth' });
}

function buildVerdictBanner(data) {
  const div = document.createElement('div');
  let cls, icon, title;
  if (data.overall_status === 'violation') {
    cls = 'violation'; icon = '⚠️'; title = '存在违规项 — 须立即整改';
  } else {
    cls = 'pass'; icon = '✅'; title = '初步审查完成';
  }
  div.className = `verdict-banner ${cls}`;
  div.innerHTML = `
    <div class="verdict-header">
      <span class="verdict-icon">${icon}</span>
      <span class="verdict-title">${title}</span>
    </div>
    <div class="verdict-body">${escHtml(data.overall_summary)}</div>
    ${data.manual_reasons && data.manual_reasons.length > 0 ? `
      <div class="manual-reasons">
        ${data.manual_reasons.map(r => `<div class="manual-reason-item">• ${escHtml(r)}</div>`).join('')}
      </div>` : ''}
  `;
  return div;
}

function buildReportActionBar() {
  const wrapper = document.createElement('div');
  wrapper.innerHTML = `<button class="secondary-btn" onclick="downloadDocxReport()">下载 Word 审图报告</button>`;
  return wrapper;
}

async function downloadDocxReport() {
  if (!lastReviewRequest || !lastReviewResult) {
    alert('请先执行一次审图');
    return;
  }

  const res = await fetch(`${API}/api/report-docx`, {
    method: 'POST',
    headers: getRequestHeaders(),
    body: JSON.stringify({ request: lastReviewRequest, result: lastReviewResult }),
  });

  if (!res.ok) {
    alert('报告生成失败，请稍后重试');
    return;
  }

  const blob = await res.blob();
  const url = window.URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const tenant = (lastReviewRequest.tenant_name || '租户').trim() || '租户';
  a.download = `消防审图报告_${tenant}_${lastReviewRequest.floor}.docx`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  window.URL.revokeObjectURL(url);
}

function buildHighlights(highlights) {
  const div = document.createElement('div');
  div.className = 'highlights-section';
  div.innerHTML = `
    <div class="highlights-title">⚡ 影响项汇总</div>
    <div class="highlight-list">
      ${highlights.map(h => {
        const cls = h.includes('🚨') ? 'critical' : 'warning';
        return `<div class="highlight-item ${cls}">${escHtml(h)}</div>`;
      }).join('')}
    </div>
  `;
  return div;
}

function buildModuleCard(key, mod) {
  const cfg = MODULE_CONFIG[key] || { icon: '📋', label: mod.module_name };
  const statusCls = `status-${mod.status}`;
  const statusLabel = STATUS_LABELS[mod.status] || mod.status;
  const cardId = `mod_${key}`;

  const card = document.createElement('div');
  card.className = `module-card ${statusCls}`;
  card.id = cardId;

  // Header
  card.innerHTML = `
    <div class="module-header" onclick="toggleModule('${cardId}')">
      <div class="module-status-dot"></div>
      <span style="font-size:14px">${cfg.icon}</span>
      <span class="module-name">${mod.module_name}</span>
      <span class="module-badge">${statusLabel}</span>
      <span class="module-chevron">▾</span>
    </div>
    <div class="module-summary">${escHtml(mod.summary)}</div>
    <div class="module-body">
      ${buildDetailsHTML(mod)}
      ${mod.impacts && mod.impacts.length > 0 ? buildImpactsHTML(mod.impacts) : ''}
      ${mod.suggestions && mod.suggestions.length > 0 ? buildSuggestionsHTML(mod.suggestions) : ''}
      ${mod.references && mod.references.length > 0 ? buildRefsHTML(mod.references) : ''}
    </div>
  `;

  // 有违规的卡片默认展开
  if (mod.status === 'violation') {
    card.classList.add('expanded');
  }

  return card;
}

function buildDetailsHTML(mod) {
  if (!mod.details || mod.details.length === 0) return '';
  // 检测计算步骤行（含①②③④⑤）
  const lines = mod.details.map(line => {
    const isCalc = /[①②③④⑤⑥⑦]|step|计算/.test(line.toLowerCase());
    return `<div class="detail-line ${isCalc ? 'calc' : ''}">${escHtml(line)}</div>`;
  }).join('');
  return `<div>${lines}</div>`;
}

function buildImpactsHTML(impacts) {
  return `
    <div class="impact-section">
      <div class="impact-title">▲ 影响项提醒</div>
      ${impacts.map(i => {
        const cls = i.includes('🚨') ? 'critical' : i.includes('⚠') ? 'warning' : 'info';
        return `<div class="impact-item ${cls}">${escHtml(i)}</div>`;
      }).join('')}
    </div>`;
}

function buildSuggestionsHTML(suggestions) {
  return `
    <div class="suggestion-section">
      <div class="suggestion-title">◆ 整改建议</div>
      ${suggestions.map(s => `<div class="suggestion-item">→ ${escHtml(s)}</div>`).join('')}
    </div>`;
}

function buildRefsHTML(refs) {
  return `
    <div class="refs-section">
      <div class="refs-title">§ 规范依据</div>
      ${refs.map(r => `
        <div class="ref-item" title="${escHtml(r.excerpt)}">
          <span class="ref-id">${escHtml(r.standard)} §${escHtml(r.article)}</span>
          &nbsp;${escHtml(r.title)}
        </div>`).join('')}
    </div>`;
}

function buildLLMSection(opinion) {
  const div = document.createElement('div');
  div.className = 'llm-section';
  div.innerHTML = `
    <div class="llm-header">
      <span class="llm-badge">QWEN</span>
      <span class="llm-title">AI 综合审查意见</span>
    </div>
    <div class="llm-actions">
      <button class="mini-btn" onclick="checkQwenSelf()">检查千问连接</button>
    </div>
    <div id="selfCheckResult" class="self-check-result"></div>
    <div class="llm-body">${escHtml(opinion)}</div>
  `;
  return div;
}

async function checkQwenSelf() {
  const resultBox = document.getElementById('selfCheckResult');
  if (!resultBox) return;
  resultBox.style.display = 'block';
  resultBox.className = 'self-check-result';
  resultBox.textContent = '正在检查千问连接...';

  try {
    const res = await fetch(`${API}/api/qwen-self-check`, {
      cache: 'no-store',
      headers: getRequestHeaders(false),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (data.ok) {
      resultBox.classList.add('ok');
      resultBox.textContent = `可用：${data.message || 'OK'}`;
    } else {
      resultBox.classList.add('fail');
      resultBox.textContent = `不可用：${data.message || '未知错误'}`;
    }
  } catch (err) {
    resultBox.classList.add('fail');
    resultBox.textContent = `检查失败：${err.message}`;
  }
}

function renderError(msg) {
  document.getElementById('emptyState').style.display = 'none';
  const content = document.getElementById('resultsContent');
  content.style.display = 'flex';
  content.innerHTML = `
    <div style="background:var(--red-dim);border:1px solid rgba(239,68,68,0.3);border-radius:var(--radius-md);padding:20px;">
      <div style="color:var(--red);font-weight:600;margin-bottom:8px;">请求失败</div>
      <div style="font-size:12px;color:var(--text-secondary);font-family:JetBrains Mono,monospace;">${escHtml(msg)}</div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:12px;">请确认后端服务已启动：运行 python run.py</div>
    </div>
  `;
}

/* ══════════════════════════════════════════════
   模块卡片展开/收起
══════════════════════════════════════════════ */
function toggleModule(id) {
  const card = document.getElementById(id);
  card.classList.toggle('expanded');
}

/* ══════════════════════════════════════════════
   工具函数
══════════════════════════════════════════════ */
function escHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// 初始化
init();
</script>
